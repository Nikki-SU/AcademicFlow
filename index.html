<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/AcademicFlow/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AcademicFlow - 学术工作流工具" />
    <meta name="theme-color" content="#A63E2E" />
    <link rel="manifest" href="manifest.json" />
    <!-- CSP：script-src 加 'unsafe-eval' 为 libsodium-wrappers WASM 必需；
         'wasm-unsafe-eval' 为浏览器端 XeLaTeX 编译（public/xelatex）必需 ——
         现代 Chrome/Firefox 编译 WASM 不再被 'unsafe-eval' 放行，必须单独声明；
         frame-src 放行 blob: 用于内嵌显示编译出的 PDF。
         其他保持严格 -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-eval' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://avatars.githubusercontent.com https://raw.githubusercontent.com; connect-src 'self' https://api.github.com https://raw.githubusercontent.com https://github.com https://api.siliconflow.cn https://mineru.net https://api.crossref.org https://api.openalex.org https://export.arxiv.org https://*.aliyuncs.com; font-src 'self' data:; manifest-src 'self'; object-src 'none'; frame-src 'self' blob:; base-uri 'self'; form-action 'self'; worker-src 'self' blob:;"
    />
    <title>AcademicFlow</title>
    <style>
      @keyframes progress-pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.55; transform: scale(1.08); }
      }
      .progress-pulse {
        animation: progress-pulse 1.4s ease-in-out infinite;
      }
    </style>
    <!--
      SPA on GitHub Pages 恢复脚本：
      与 public/404.html 配套。若 URL 是 /AcademicFlow/?/xxx 格式，
      解出真实路径 /AcademicFlow/xxx 并 replaceState，避免刷新 404。
      参考：https://github.com/rafgraph/spa-github-pages (MIT License)
    -->
    <script type="text/javascript" src="spa-recovery.js"></script>
    <script type="text/javascript" src="register-sw.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
