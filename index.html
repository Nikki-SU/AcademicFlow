<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/AcademicFlow/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AcademicFlow - 学术工作流工具" />
    <meta name="theme-color" content="#4f46e5" />
    <link rel="manifest" href="manifest.json" />
    <!-- CSP：script-src 加 'unsafe-eval' 为 libsodium-wrappers WASM 必需；其他保持严格 -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://avatars.githubusercontent.com https://raw.githubusercontent.com; connect-src 'self' https://api.github.com https://raw.githubusercontent.com https://github.com https://api.siliconflow.cn https://mineru.net https://api.crossref.org https://api.openalex.org https://export.arxiv.org https://*.aliyuncs.com; font-src 'self' data:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; worker-src 'self' blob:;"
    />
    <title>AcademicFlow</title>
    <style>
      @keyframes progress-pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.55; transform: scale(1.08); }
      }
      .progress-pulse {
        animation: progress-pulse 1.4s ease-in-out infinite;
      }
    </style>
    <!--
      SPA on GitHub Pages 恢复脚本：
      与 public/404.html 配套。若 URL 是 /AcademicFlow/?/xxx 格式，
      解出真实路径 /AcademicFlow/xxx 并 replaceState，避免刷新 404。
      参考：https://github.com/rafgraph/spa-github-pages (MIT License)
    -->
    <script type="text/javascript" src="spa-recovery.js"></script>
    <script type="text/javascript" src="register-sw.js"></script>
    <!--
      Vditor 图标 sprite 必须在这里用「外部脚本」预加载。
      原因：Vditor 默认用内联 <script> 注入图标 sprite（把 ant.js 源码塞进 script.text），
      而本站 CSP 是 script-src 'self' 'unsafe-eval'（没有 'unsafe-inline'），内联脚本会被拦掉
      → sprite 进不来 → 工具栏所有内置图标（加粗/斜体/列表…）全部空白。
      这里提前用外部脚本加载，CSP 放行；id 与 Vditor 内部用的一致，避免它再走一次被拦的内联路径。
      defer 保证执行时 document.body 已存在（ant.js 会往 body 里插 svg）。
    -->
    <script id="vditorIconScript" defer src="%BASE_URL%vditor/dist/js/icons/ant.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
