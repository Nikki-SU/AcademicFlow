<?xml version="1.0"?>
<fontconfig>
  <dir>/fonts</dir>
  <!-- AcademicFlow: 宏包自带的 OTF/TTF 有一部分是装在 texmf 树里的（libertine / newtx /
       lm-math / libertinus…）。XeTeX 的 OPENTYPEFONTS 已经包含 texmf 树，所以**按文件名**
       引用没问题；但 fontspec 按**字体族名**引用时要靠 fontconfig 的名字索引，只扫 /fonts
       就找不到。这里把这两个目录也加进来。 -->
  <dir>/texmf/fonts/opentype</dir>
  <dir>/texmf/fonts/truetype</dir>

  <!-- AcademicFlow: 有些文档类按「系统已装」的字体名去要字体，而包里那份的族名并不叫这个名字：
       acmart 的 \setmonofont{inconsolata} 就是典型 —— 随包发布的 OTF 族名是 Inconsolatazi4 /
       InconsolataN，全系统里没有族名恰好是 Inconsolata 的字体，于是 fontspec 直接报
       "The font \"inconsolata\" cannot be found"。用 fontconfig 别名把这两个常见名字接上。 -->
  <match target="pattern">
    <test name="family" ignore-blanks="true">
      <string>inconsolata</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Inconsolatazi4</string>
    </edit>
  </match>

  <cachedir>/work/fontconfig-cache</cachedir>
  <config>
    <rescan>
      <int>0</int>
    </rescan>
  </config>
</fontconfig>
