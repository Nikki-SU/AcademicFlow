name: note_convert

# 笔记附件转换：
#   Word(.doc / .docx)  → PDF（LibreOffice headless）→ Markdown（MinerU）
#   PDF                 → 直接走 MinerU
# 触发：repository_dispatch event_type=note_convert
#   payload: { base_path, items: [{ note_name, source_path }] }
#     base_path  = 阅读对象的仓库根目录（literatures/{slug} | textbooks/{书名} | documents/{目录名}）
#     items      = 待转换的笔记列表；一次 dispatch 可带多篇，共用一次环境安装
#       note_name  = 目标笔记名（不含 .md；前端已按已有笔记去重）
#       source_path= 前端上传到私库的源文件（{base_path}/attachments/{ts}_{文件名}）
#   手动调试也可只给 base_path + note_name + source_path（按单篇处理）
on:
  repository_dispatch:
    types: [note_convert]
  workflow_dispatch:
    inputs:
      base_path:
        description: '对象根目录（手动调试用）'
        required: false
        default: ''
      note_name:
        description: '笔记名（手动调试用）'
        required: false
        default: ''
      source_path:
        description: '源文件路径（手动调试用）'
        required: false
        default: ''

# 笔记转换独立并发组：笔记上传常是若干个小文件，若和长跑的文献 / 图书 pipeline
# 共用 "pipeline-write-main"，会排在它们后面干等（用户等不了）。
# 独立成组后各跑各的；push 到 main 的竞态由脚本内的 force-with-lease 重试兜底。
concurrency:
  group: "note-convert-main"
  cancel-in-progress: false

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout repo (full history for git push)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      # Word → PDF 靠 LibreOffice headless。runner 是全新 VM、镜像层不跨 run 复用，
      # 若每次现装要 1~2 分钟。这里把 apt 下载的 .deb 缓存进 GitHub Actions 缓存：
      # 命中时 apt 直接读本地 .deb 安装（秒级），未命中才联网下载并回填缓存。
      # 缓存 key 带本 workflow 文件的哈希——改了下面的安装列表就自动换 key，绝不装到旧包。
      - name: Restore apt package cache
        uses: actions/cache@v4
        with:
          path: ~/.apt-cache/archives
          key: apt-lo-cjk-${{ runner.os }}-${{ hashFiles('.github/workflows/note_convert.yml') }}
          restore-keys: |
            apt-lo-cjk-${{ runner.os }}-

      # 装精简版 LibreOffice（-nogui，避开交互式组件）+ 中文字体（避免中文变方框）+ qpdf（超长 PDF 切段）。
      # -o Dir::Cache::archives 让 apt 从缓存目录读/写 .deb；
      # -o APT::Keep-Downloaded-Packages 让装完的 .deb 留在缓存里（apt 默认会删，删了就白缓存了）。
      - name: Install LibreOffice + CJK fonts + qpdf
        run: |
          ARCHIVE_DIR="$HOME/.apt-cache/archives"
          sudo mkdir -p "$ARCHIVE_DIR/partial"
          sudo chown -R "$USER" "$HOME/.apt-cache"
          sudo apt-get update -qq
          sudo apt-get \
            -o Dir::Cache::archives="$ARCHIVE_DIR" \
            -o APT::Keep-Downloaded-Packages="true" \
            install -y -qq --no-install-recommends \
            libreoffice-writer-nogui libreoffice-core-nogui fonts-noto-cjk qpdf
          sudo chown -R "$USER" "$HOME/.apt-cache"
          soffice --version
          qpdf --version

      - name: Configure git
        run: |
          git config user.name "AcademicFlow Bot"
          git config user.email "academicflow@users.noreply.github.com"

      - name: Run note convert pipeline
        env:
          MINERU_API_TOKEN: ${{ secrets.MINERU_API_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO:  ${{ github.event.repository.name }}
          # payload 经环境变量传入，避免文件名含单引号时破坏 shell 引号结构
          PIPELINE_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: |
          echo "base_path:   ${{ github.event.client_payload.base_path }}"
          echo "items:       ${{ toJSON(github.event.client_payload.items) }}"
          echo "note_name:   ${{ github.event.client_payload.note_name }}"
          echo "source_path: ${{ github.event.client_payload.source_path }}"
          node .github/scripts/note_convert.mjs "$PIPELINE_PAYLOAD"
