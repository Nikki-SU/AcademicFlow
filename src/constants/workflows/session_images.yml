name: session_images

# 会议/课程「照片 + 课程材料」→ MinerU → markdown
#
# 与 book_convert 的区别：图书是「一整本 PDF → content.md」，这里是
# 「一节课的多张照片 → 各自识别 → 合并成同一份 board.md；课程材料（PDF/PPT/Word）
# → 每份转成 materials-md/{名}.md」。多张照片进、一份 board 出；材料一份进、一份 md 出。
#
# 触发：repository_dispatch event_type=session_images，payload { task_id, session_id }
# 源目录：projects/{task_id}/sessions/{session_id}/images/ 与 materials/
# 产物：  projects/{task_id}/sessions/{session_id}/board.md        （所有照片识别合并）
#         projects/{task_id}/sessions/{session_id}/board-images/   （照片识别抽出的图）
#         projects/{task_id}/sessions/{session_id}/materials-md/   （每份材料一份 md）
#         projects/{task_id}/sessions/{session_id}/materials-md-images/（材料识别抽出的图）
on:
  repository_dispatch:
    types: [session_images]
  workflow_dispatch:
    inputs:
      task_id:
        description: '任务 id（手动调试用）'
        required: false
        default: ''
      session_id:
        description: '课时 id（手动调试用）'
        required: false
        default: ''

# 与其它写 main 的 pipeline 共用同一个并发组，避免同时 push 打架
concurrency:
  group: "pipeline-write-main"
  cancel-in-progress: false

jobs:
  convert:
    runs-on: ubuntu-latest
    # 超时是「异常检测线」，不是「任务时长预算」：正常总耗时分钟级
    # （checkout/setup-node ~1min + LibreOffice 冷装 1~2min（缓存命中秒级）+
    # MinerU 转换几分钟，照片识别每张一次调用更快），45 分钟余量已极大；
    # 设更大只会让异常（卡死/死循环）被埋得更深。
    # 注意 timeout-minutes 从 job 开始执行算起，不含 runner 排队时间。
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout repo (full history for git push)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      # Word/PPT → PDF 靠 LibreOffice headless。runner 是全新 VM、镜像层不跨 run 复用，
      # 若每次现装要 1~2 分钟。这里把 apt 下载的 .deb 缓存进 GitHub Actions 缓存：
      # 命中时 apt 直接读本地 .deb 安装（秒级），未命中才联网下载并回填缓存。
      # 缓存 key 带本 workflow 文件的哈希——改了下面的安装列表就自动换 key，绝不装到旧包。
      - name: Restore apt package cache
        uses: actions/cache@v4
        with:
          path: ~/.apt-cache/archives
          key: apt-lo-cjk-${{ runner.os }}-${{ hashFiles('.github/workflows/session_images.yml') }}
          restore-keys: |
            apt-lo-cjk-${{ runner.os }}-

      # 装精简版 LibreOffice（-nogui，避开交互式组件）+ 中文字体（避免中文变方框）+ qpdf（超长 PDF 切段）。
      # -o Dir::Cache::archives 让 apt 从缓存目录读/写 .deb；
      # -o APT::Keep-Downloaded-Packages 让装完的 .deb 留在缓存里（apt 默认会删，删了就白缓存了）。
      - name: Install LibreOffice + CJK fonts + qpdf
        run: |
          ARCHIVE_DIR="$HOME/.apt-cache/archives"
          sudo mkdir -p "$ARCHIVE_DIR/partial"
          sudo chown -R "$USER" "$HOME/.apt-cache"
          sudo apt-get update -qq
          sudo apt-get \
            -o Dir::Cache::archives="$ARCHIVE_DIR" \
            -o APT::Keep-Downloaded-Packages="true" \
            install -y -qq --no-install-recommends \
            libreoffice-writer-nogui libreoffice-core-nogui fonts-noto-cjk qpdf
          sudo chown -R "$USER" "$HOME/.apt-cache"
          soffice --version
          qpdf --version

      - name: Configure git
        run: |
          git config user.name "AcademicFlow Bot"
          git config user.email "academicflow@users.noreply.github.com"

      - name: Run session images pipeline
        env:
          MINERU_API_TOKEN: ${{ secrets.MINERU_API_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO:  ${{ github.event.repository.name }}
          # payload 经环境变量传入，避免路径含特殊字符时破坏 shell 引号结构
          PIPELINE_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: |
          echo "task_id:    ${{ github.event.client_payload.task_id }}"
          echo "session_id: ${{ github.event.client_payload.session_id }}"
          node .github/scripts/session_images.mjs "$PIPELINE_PAYLOAD"
