name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages 部署所需最小权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时刻只允许一个 pages 部署在跑 —— 取消进行中的，用最新 commit 覆盖
# 避免连续 push 导致多个 build 并行排队/互相踩
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10   # build 超时保护，防止无限跑浪费 free minutes
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Check package-lock.json is in sync with package.json
        run: |
          # npm ci 要求 package-lock 和 package.json 严格匹配
          # --ignore-scripts：跳过 prepare（husky），只校验 lock 文件是否匹配
          if ! npm ci --dry-run --ignore-scripts 2>&1; then
            echo "FAIL: package-lock.json is out of sync with package.json"
            echo "Run 'npm install' locally, commit package-lock.json, then push."
            exit 1
          fi
          echo "✓ package-lock.json in sync"

      - name: Install dependencies
        run: npm ci   # 严格按 package-lock.json 安装，reproducible

      - name: Build (tsc + vite)
        run: npm run build

      - name: Sanity check dist
        run: |
          test -f dist/index.html || { echo "FAIL: dist/index.html missing"; exit 1; }
          test -f dist/404.html   || { echo "FAIL: dist/404.html missing";   exit 1; }
          echo "✓ dist OK — $(ls dist/assets/ | wc -l) asset files, $(du -sh dist | cut -f1) total"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
