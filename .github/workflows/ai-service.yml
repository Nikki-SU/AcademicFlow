name: AI Service

on:
  repository_dispatch:
    types: [ai_call]

# 多个 AI call 并发跑会抢 siliconflow 等 provider 的 token 配额（rate limit）
# 排队比撞 rate limit 然后用户看到失败好
concurrency:
  group: "ai-service-call"
  cancel-in-progress: false

jobs:
  ai:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── git config (required for ai-service.mjs git commit) ──
      - name: Configure git
        run: |
          git config user.name "AcademicFlow Bot"
          git config user.email "academicflow@users.noreply.github.com"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run AI service
        env:
          AI1_BASE_URL: ${{ secrets.AI1_BASE_URL }}
          AI1_API_KEY: ${{ secrets.AI1_API_KEY }}
          AI1_MODEL: ${{ secrets.AI1_MODEL }}
          AI2_BASE_URL: ${{ secrets.AI2_BASE_URL }}
          AI2_API_KEY: ${{ secrets.AI2_API_KEY }}
          AI2_MODEL: ${{ secrets.AI2_MODEL }}

          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO: ${{ github.event.repository.name }}
        run: |
          node .github/scripts/ai-service.mjs '${{ toJSON(github.event.client_payload) }}'
