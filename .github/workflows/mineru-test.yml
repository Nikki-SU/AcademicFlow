name: MinerU Connectivity Test

on:
  repository_dispatch:
    types: [mineru_connectivity_test]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test MinerU connectivity
        env:
          MINERU_API_TOKEN: ${{ secrets.MINERU_API_TOKEN }}
        run: |
          node .github/scripts/mineru-test.mjs
