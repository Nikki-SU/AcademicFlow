name: AI Connectivity Test

on:
  repository_dispatch:
    types: [ai_connectivity_test]
  workflow_dispatch:
    inputs:
      target:
        description: '测哪个 (ai1 / ai2 / both)'
        required: false
        default: 'both'
        type: choice
        options:
          - ai1
          - ai2
          - both

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Test AI connectivity on runner
        env:
          AI1_BASE_URL: ${{ secrets.AI1_BASE_URL }}
          AI1_API_KEY:  ${{ secrets.AI1_API_KEY }}
          AI1_MODEL:    ${{ secrets.AI1_MODEL }}
          AI2_BASE_URL: ${{ secrets.AI2_BASE_URL }}
          AI2_API_KEY:  ${{ secrets.AI2_API_KEY }}
          AI2_MODEL:    ${{ secrets.AI2_MODEL }}
          TARGET:       ${{ github.event.client_payload.target || github.event.inputs.target || 'both' }}
        run: |
          node .github/scripts/ai-connectivity-test.mjs
