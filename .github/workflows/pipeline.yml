name: Paper Pipeline

on:
  repository_dispatch:
    types: [paper_convert]
  workflow_dispatch:
    inputs:
      doi:
        description: 'DOI (手动调试用，通常由 repository_dispatch 携带)'
        required: false
        default: ''
      pdf_path:
        description: 'PDF 路径 (手动调试用)'
        required: false
        default: ''

# Pipeline 会写 main（git push），并发跑会 non-fast-forward 冲突
concurrency:
  group: "pipeline-write-main"
  cancel-in-progress: false

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout repo (full history for git push)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      # ── git config (required for pipeline.mjs git commit) ──
      - name: Configure git
        run: |
          git config user.name "AcademicFlow Bot"
          git config user.email "academicflow@users.noreply.github.com"

      # ── 单一 pipeline step ──
      # 前端 Settings → sync 时把选中 provider 的 base_url/api_key/model
      # 直接写到不带前缀的 AI1_BASE_URL / AI1_API_KEY / AI1_MODEL / AI2_*
      # 所以 workflow 永远只读这 7 个不带前缀的 secrets，不用关心 provider 切换
      - name: Run pipeline
        env:
          MINERU_API_TOKEN: ${{ secrets.MINERU_API_TOKEN }}

          AI1_BASE_URL: ${{ secrets.AI1_BASE_URL }}
          AI1_API_KEY:  ${{ secrets.AI1_API_KEY }}
          AI1_MODEL:    ${{ secrets.AI1_MODEL }}
          AI2_BASE_URL: ${{ secrets.AI2_BASE_URL }}
          AI2_API_KEY:  ${{ secrets.AI2_API_KEY }}
          AI2_MODEL:    ${{ secrets.AI2_MODEL }}

          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO:  ${{ github.event.repository.name }}
        run: |
          echo "AI1 endpoint:  $AI1_BASE_URL"
          echo "AI1 model:     $AI1_MODEL"
          echo "AI2 endpoint:  $AI2_BASE_URL"
          echo "AI2 model:     $AI2_MODEL"
          echo "Starting pipeline..."
          node .github/scripts/pipeline.mjs '${{ toJSON(github.event.client_payload) }}'
